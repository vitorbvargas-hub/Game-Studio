<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GS-003 · Sprite Viewer (interno)</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <strong>GS-003 · Sprite Viewer</strong>
      <span id="schema-badge" class="badge"></span>
      <span id="roots" class="muted"></span>
      <button id="reload" title="Reler a biblioteca do disco">Recarregar</button>
    </header>
    <main>
      <aside>
        <div class="filters">
          <input id="f-text" type="search" placeholder="Buscar id, nome, elemento…" />
          <select id="f-root"><option value="">Todas as fontes</option></select>
          <select id="f-category"><option value="">Todas as categorias</option></select>
          <select id="f-rarity"><option value="">Todas as raridades</option></select>
          <select id="f-status"><option value="">Todos os status</option></select>
          <div id="count" class="muted"></div>
        </div>
        <div id="gallery"></div>
      </aside>
      <section id="detail">
        <p class="muted">Selecione uma criatura na galeria.</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
