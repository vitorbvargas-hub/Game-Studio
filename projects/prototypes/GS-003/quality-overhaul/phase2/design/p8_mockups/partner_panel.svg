    <rect x="60" y="2" width="130" height="5" fill="#262b40"/><rect x="60" y="2" width="100" height="5" fill="#feae34"/>
    <text x="0" y="22" fill="#8b93b0" font-size="9">Defesa</text>
    <rect x="60" y="16" width="130" height="5" fill="#262b40"/><rect x="60" y="16" width="70" height="5" fill="#feae34"/>
    <text x="0" y="36" fill="#8b93b0" font-size="9">Veloc.</text>
    <rect x="60" y="30" width="130" height="5" fill="#262b40"/><rect x="60" y="30" width="90" height="5" fill="#feae34"/>
  </g>
  <text x="20" y="150" fill="#8b93b0" font-size="8">anel retrato 3px = elemento (fogo) · barras de stat na cor do elemento, não verde fixo</text>

  <text x="20" y="176" fill="#8b93b0" font-size="10" font-weight="bold">GOLPES</text>
  <g transform="translate(20,186)">
    <rect width="380" height="24" fill="#1a1e2c"/><rect width="4" height="24" fill="#4a2f2a"/>
