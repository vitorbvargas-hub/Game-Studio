  <g transform="translate(20,242)">
    <rect width="380" height="24" fill="#1a1e2c"/><rect width="4" height="24" fill="#1f4a2f"/>
    <text x="10" y="16" fill="#e6e9f2" font-size="10">Regeneração</text><text x="330" y="16" fill="#8b93b0" font-size="9">Cura</text>
