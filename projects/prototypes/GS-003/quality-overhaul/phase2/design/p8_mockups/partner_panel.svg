<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" font-family="monospace">
  <rect width="420" height="320" fill="#0e1016"/>
  <text x="4" y="14" fill="#8b93b0" font-size="10">Ficha do parceiro — retrato com anel de elemento, stats coloridas, golpes por categoria</text>

  <rect x="10" y="24" width="400" height="286" fill="#12141d" stroke="#59618a" stroke-width="2"/>
  <text x="20" y="44" fill="#e8b84a" font-size="13" font-weight="bold">GUILMON</text>
  <circle cx="54" cy="90" r="38" fill="none" stroke="#feae34" stroke-width="3"/>
  <rect x="18" y="54" width="72" height="72" fill="#2b3150"/>
  <text x="100" y="60" fill="#e6e9f2" font-size="12" font-weight="bold">Guilmon <tspan fill="#e8b84a" font-size="10">Lv.13</tspan></text>
  <rect x="330" y="52" width="60" height="16" fill="#23283b"/>
  <text x="336" y="63" fill="#8b93b0" font-size="8">ROOKIE</text>

  <g transform="translate(100,74)">
