<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" font-family="monospace">
  <rect width="900" height="140" fill="#0e1016"/>
  <!-- bottom bar footprint, 96px height -->
  <rect x="0" y="36" width="900" height="96" fill="#11131c" stroke="#4a5175" stroke-width="3"/>
  <text x="4" y="14" fill="#8b93b0" font-size="10">Barra inferior — altura 96px (inalterada). Grid 4px.</text>

  <!-- minimap -->
  <rect x="8" y="44" width="132" height="80" fill="#0a0c12" stroke="#3b4261" stroke-width="2"/>
  <circle cx="74" cy="84" r="48" fill="#1c2030" stroke="#59618a" stroke-width="4"/>
  <text x="68" y="52" fill="#e8b84a" font-size="8">N</text>
  <circle cx="74" cy="84" r="2" fill="#e8b84a"/>
  <text x="12" y="132" fill="#8b93b0" font-size="8">minimapa 132x80 / círculo ø96</text>

  <!-- inventory -->
  <rect x="148" y="44" width="82" height="80" fill="#0a0c12" stroke="#3b4261" stroke-width="2"/>
  <text x="155" y="90" fill="#e6e9f2" font-size="9">INV</text>
  <text x="150" y="132" fill="#8b93b0" font-size="8">82x80</text>

  <!-- menu shortcuts 6x34x2 -->
  <g transform="translate(238,48)">
    <rect width="212" height="72" fill="#0a0c12" stroke="#3b4261" stroke-width="2"/>
    <g fill="#1f2334" stroke="#343a55" stroke-width="2">
      <rect x="4" y="4" width="34" height="34"/><rect x="42" y="4" width="34" height="34"/><rect x="80" y="4" width="34" height="34"/>
      <rect x="118" y="4" width="34" height="34"/><rect x="156" y="4" width="34" height="34"/><rect x="194" y="4" width="34" height="34" transform="translate(-20,0)"/>
      <rect x="4" y="42" width="34" height="34"/><rect x="42" y="42" width="34" height="34"/><rect x="80" y="42" width="34" height="34"/>
      <rect x="118" y="42" width="34" height="34"/><rect x="156" y="42" width="34" height="34"/>
    </g>
  </g>
  <text x="240" y="132" fill="#8b93b0" font-size="8">menu 6x34px x2 linhas</text>

  <!-- TAMER block (new) -->
  <g transform="translate(460,44)">
    <rect width="120" height="80" fill="rgba(14,16,24,0.78)" stroke="#63c74d" stroke-width="3"/>
    <rect x="4" y="4" width="4" height="4" fill="#0b0d13"/><rect x="112" y="4" width="4" height="4" fill="#0b0d13"/>
    <rect x="4" y="72" width="4" height="4" fill="#0b0d13"/><rect x="112" y="72" width="4" height="4" fill="#0b0d13"/>
    <rect x="8" y="8" width="48" height="48" fill="#2b3150"/>
    <text x="60" y="18" fill="#e6e9f2" font-size="9" font-weight="bold">Tamer Lv.9</text>
    <rect x="60" y="24" width="68" height="7" fill="#262b40"/>
    <rect x="60" y="24" width="50" height="7" fill="#63c74d"/>
    <rect x="60" y="33" width="68" height="5" fill="#262b40"/>
    <rect x="60" y="33" width="40" height="5" fill="#3a78c4"/>
    <text x="60" y="46" fill="#8b93b0" font-size="7">PV  Energia</text>
  </g>
  <text x="462" y="132" fill="#8b93b0" font-size="8">TAMER (novo) 120x80, moldura N1 reativa</text>

  <!-- PARTNER block -->
  <g transform="translate(588,44)">
    <rect width="260" height="80" fill="rgba(14,16,24,0.78)" stroke="#e8b84a" stroke-width="3"/>
    <circle cx="36" cy="40" r="34" fill="none" stroke="#feae34" stroke-width="3"/>
    <rect x="8" y="8" width="56" height="64" fill="#2b3150"/>
    <text x="74" y="20" fill="#e6e9f2" font-size="11" font-weight="bold">Guilmon <tspan fill="#e8b84a" font-size="9">Lv.13</tspan></text>
    <rect x="74" y="28" width="150" height="7" fill="#262b40"/><rect x="74" y="28" width="110" height="7" fill="#8fe07a"/>
    <rect x="74" y="38" width="150" height="7" fill="#262b40"/><rect x="74" y="38" width="90" height="7" fill="#6fd35a"/>
    <rect x="74" y="48" width="150" height="7" fill="#262b40"/><rect x="74" y="48" width="60" height="7" fill="#69c3ff"/>
  </g>
  <text x="590" y="132" fill="#8b93b0" font-size="8">PARCEIRO 260x80, anel elemento (fogo)</text>

  <!-- team slots -->
  <g transform="translate(856,44)">
    <rect width="40" height="80" fill="#1a1e2c" stroke="#8fe07a" stroke-width="2"/>
    <text x="4" y="14" fill="#c4cae0" font-size="8">Lv5</text>
  </g>
  <text x="820" y="132" fill="#8b93b0" font-size="8">equipe (slot, borda=elemento)</text>
</svg>
