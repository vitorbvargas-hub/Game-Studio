<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" font-family="monospace">
  <rect width="560" height="200" fill="#0e1016"/>
  <text x="4" y="14" fill="#8b93b0" font-size="10">Inventário — cartões com borda dupla (categoria + raridade) + painel de detalhe</text>

  <!-- card 1: cura comum -->
  <g transform="translate(10,24)">
    <rect width="76" height="86" fill="#1a1e2c" stroke="#1f4a2f" stroke-width="2"/>
    <rect x="2" y="2" width="72" height="82" fill="none" stroke="#8b93b0" stroke-width="1"/>
    <rect x="26" y="8" width="24" height="24" fill="#1f4a2f"/>
    <text x="8" y="60" fill="#e6e9f2" font-size="9">Poção</text>
    <text x="54" y="80" fill="#8b93b0" font-size="9">×3</text>
  </g>
  <text x="10" y="120" fill="#8b93b0" font-size="7">cura (verde) / comum (cinza)</text>

  <!-- card 2: captura raro -->
  <g transform="translate(96,24)">
    <rect width="76" height="86" fill="#1a1e2c" stroke="#124e89" stroke-width="2"/>
    <rect x="2" y="2" width="72" height="82" fill="none" stroke="#2ce8f5" stroke-width="1"/>
    <rect x="26" y="8" width="24" height="24" fill="#124e89"/>
    <text x="4" y="60" fill="#e6e9f2" font-size="9">Digivice</text>
    <text x="54" y="80" fill="#8b93b0" font-size="9">×1</text>
  </g>
  <text x="96" y="120" fill="#8b93b0" font-size="7">captura (azul) / raro (ciano)</text>

  <!-- card 3: evolução muito raro, selected -->
  <g transform="translate(182,24)">
    <rect width="78" height="88" fill="#252335" stroke="#68386c" stroke-width="2" transform="scale(1.02)"/>
    <rect x="2" y="2" width="74" height="84" fill="none" stroke="#e8b84a" stroke-width="1"/>
    <rect x="27" y="8" width="24" height="24" fill="#68386c"/>
    <text x="4" y="62" fill="#e6e9f2" font-size="9">Cristal Dig.</text>
    <text x="56" y="82" fill="#8b93b0" font-size="9">×1</text>
  </g>
  <text x="182" y="124" fill="#8b93b0" font-size="7">evolução (roxo) / muito raro (dourado, selecionado)</text>

  <!-- detail panel -->
  <g transform="translate(320,24)">
    <rect width="220" height="150" fill="#12141d" stroke="#59618a" stroke-width="2"/>
    <text x="10" y="20" fill="#e8b84a" font-size="11" font-weight="bold">Cristal Digital</text>
    <text x="10" y="36" fill="#68386c" font-size="9">Evolução · Muito raro</text>
    <text x="10" y="58" fill="#c4cae0" font-size="9">Necessário para evoluir</text>
    <text x="10" y="70" fill="#c4cae0" font-size="9">certos Digimon Champion+.</text>
    <text x="10" y="92" fill="#8b93b0" font-size="9">Quantidade: 1</text>
    <rect x="10" y="110" width="200" height="28" fill="#1f2334" stroke="#343a55" stroke-width="2"/>
    <text x="70" y="128" fill="#e6e9f2" font-size="10">Usar</text>
  </g>
  <text x="320" y="186" fill="#8b93b0" font-size="7">painel de detalhe 220px, nível 2, abre ao selecionar</text>
</svg>
