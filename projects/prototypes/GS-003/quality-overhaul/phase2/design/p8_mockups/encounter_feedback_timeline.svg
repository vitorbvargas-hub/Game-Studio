<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" font-family="monospace">
  <rect width="880" height="220" fill="#0e1016"/>
  <text x="4" y="16" fill="#8b93b0" font-size="10">Entrada em combate legível — sequência t=0 a 1200ms (seção 8.1)</text>

  <!-- frame 1: rustle -->
  <g transform="translate(20,36)">
    <rect width="190" height="160" fill="#15210f" stroke="#3b4261" stroke-width="2"/>
    <text x="8" y="16" fill="#8b93b0" font-size="9">t=0ms</text>
    <rect x="70" y="110" width="40" height="36" fill="#2a4a1f" transform="rotate(-6 90 128)"/>
    <text x="8" y="150" fill="#c9f7d0" font-size="8">farfalhar, 3 quadros</text>
  </g>

  <!-- frame 2: ! -->
  <g transform="translate(230,36)">
    <rect width="190" height="160" fill="#15210f" stroke="#3b4261" stroke-width="2"/>
    <text x="8" y="16" fill="#8b93b0" font-size="9">t=0-350ms</text>
    <rect x="40" y="90" width="24" height="24" fill="#2b3150"/>
    <rect x="36" y="56" width="18" height="22" fill="rgba(10,12,18,0.72)" stroke="#e6e9f2" stroke-width="1"/>
    <text x="41" y="72" fill="#fff" font-size="12" font-weight="bold">!</text>
    <text x="8" y="150" fill="#c9f7d0" font-size="8">"!" 12x16, pill 18x22, zoom cam 1.0→1.06</text>
  </g>

  <!-- frame 3: jump -->
  <g transform="translate(440,36)">
    <rect width="190" height="160" fill="#15210f" stroke="#3b4261" stroke-width="2"/>
    <text x="8" y="16" fill="#8b93b0" font-size="9">t=350-700ms</text>
    <rect x="70" y="70" width="32" height="32" fill="#8a5a2a"/>
    <ellipse cx="86" cy="104" rx="18" ry="5" fill="#000" opacity="0.4"/>
    <text x="8" y="150" fill="#c9f7d0" font-size="8">arco 10-14px, poeira no pouso</text>
  </g>

  <!-- frame 4: plate+NOVO -->
  <g transform="translate(650,36)">
    <rect width="210" height="160" fill="#15210f" stroke="#3b4261" stroke-width="2"/>
    <text x="8" y="16" fill="#8b93b0" font-size="9">t=700-1000ms</text>
    <rect x="60" y="60" width="32" height="32" fill="#8a5a2a"/>
    <g transform="translate(40,96)">
      <rect width="88" height="20" fill="rgba(10,12,18,0.72)" stroke="#63c74d" stroke-width="2"/>
      <text x="6" y="14" fill="#e6e9f2" font-size="8">Dorumon Nv.14</text>
      <rect x="64" y="2" width="20" height="12" fill="#e8b84a"/>
      <text x="66" y="11" fill="#171a26" font-size="6" font-weight="bold">NOVO</text>
    </g>
    <text x="8" y="150" fill="#c9f7d0" font-size="8">placa 88x20, borda=raridade; selo NOVO 1ª vez</text>
  </g>
</svg>
