<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" font-family="monospace">
  <rect width="800" height="200" fill="#0e1016"/>
  <text x="4" y="14" fill="#8b93b0" font-size="10">Diálogo (novo) — 760x140, retrato sobressaindo 24px, nameplate, texto, chevron</text>

  <g transform="translate(20,34)">
    <rect width="760" height="140" fill="#12141d" stroke="#59618a" stroke-width="2"/>
    <!-- portrait overlapping top by 24px -->
    <rect x="12" y="-24" width="96" height="96" fill="#2b3150" stroke="#59618a" stroke-width="2"/>
    <rect x="12" y="68" width="104" height="20" fill="#e8b84a" opacity="0.15"/>
    <text x="18" y="83" fill="#e8b84a" font-size="11">Mercador</text>
    <text x="130" y="30" fill="#e6e9f2" font-size="12">Bem-vindo à Clareira, Tamer. A fonte</text>
    <text x="130" y="48" fill="#e6e9f2" font-size="12">de cura logo ali cura sua equipe de</text>
    <text x="130" y="66" fill="#e6e9f2" font-size="12">graça — fica perto do riacho.</text>
    <polygon points="736,118 744,118 740,126" fill="#e6e9f2"/>
    <!-- choice rows (alt state) -->
    <g transform="translate(16,96)" opacity="0.5">
      <rect width="728" height="36" fill="#1f2334" stroke="#343a55" stroke-width="2"/>
      <text x="10" y="22" fill="#8b93b0" font-size="10">(estado alternativo: escolha substitui o texto)</text>
    </g>
  </g>
  <text x="20" y="188" fill="#8b93b0" font-size="8">retrato 96x96 · nameplate 104x20 (gold 15%) · chevron 12x12 pisca · texto 640px, 13px, lh 1.4</text>
</svg>
