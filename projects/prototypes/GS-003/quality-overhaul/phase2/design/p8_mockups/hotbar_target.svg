      <rect width="52" height="52" fill="#0d0f16" stroke="#feae34" stroke-width="3"/>
      <text x="4" y="12" fill="#fff" font-size="9">1</text>
      <text x="26" y="48" fill="#feae34" font-size="7">físico</text>
    </g>
    <g transform="translate(64,8)">
