<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="monospace" shape-rendering="crispEdges">
  <rect width="820" height="320" fill="#0e1018"/>
  <g stroke="#1c2030" stroke-width="1">
    <path d="M0,40H820 M0,80H820 M0,120H820 M0,160H820 M0,200H820 M0,240H820 M0,280H820"/>
  </g>
  <text x="10" y="18" fill="#8b93b0" font-size="11">vinculo_blocked.svg — aba Vínculo: estado ATUAL (bloqueado) vs. estado SE APROVADO (referência, não implementado)</text>

  <!-- estado atual -->
  <rect x="30" y="35" width="370" height="260" fill="rgba(20,23,34,0.92)" stroke="#3b4261" stroke-width="2"/>
  <text x="215" y="55" fill="#e6e9f2" font-size="10" text-anchor="middle" font-weight="bold">ESTADO ATUAL (o que mostrar hoje)</text>
  <text x="215" y="120" font-size="30" text-anchor="middle">🔒</text>
  <text x="215" y="155" fill="#e6e9f2" font-size="10" text-anchor="middle" font-weight="bold">Vínculo ainda não é uma mecânica ativa</text>
  <text x="215" y="178" fill="#9ea7c2" font-size="8" text-anchor="middle">Proposta pronta em VIDEO_IDEAS_SPEC.md §2,</text>
  <text x="215" y="192" fill="#9ea7c2" font-size="8" text-anchor="middle">aguardando aprovação do fundador.</text>
  <text x="215" y="216" fill="#9ea7c2" font-size="8" text-anchor="middle">Nenhum número é mostrado até a regra</text>
  <text x="215" y="230" fill="#9ea7c2" font-size="8" text-anchor="middle">existir de fato (nunca uma barra fingida).</text>
  <rect x="60" y="250" width="310" height="22" fill="none" stroke="#2b3047" stroke-width="1"/>
  <text x="215" y="265" fill="#5a6177" font-size="8" text-anchor="middle">critério de aceite: 0 barras numéricas aqui enquanto bloqueado</text>

  <!-- estado se aprovado -->
  <rect x="420" y="35" width="370" height="260" fill="rgba(20,23,34,0.92)" stroke="#3b4261" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="605" y="55" fill="#9ea7c2" font-size="10" text-anchor="middle" font-weight="bold">SE APROVADO (referência — não implementado agora)</text>

  <text x="440" y="82" fill="#e6e9f2" font-size="9">Disciplina</text>
  <rect x="440" y="88" width="330" height="10" fill="#1a1e2c"/>
  <rect x="440" y="88" width="180" height="10" fill="#feae34"/>
  <text x="780" y="97" fill="#9ea7c2" font-size="8" text-anchor="end">55/100</text>

  <text x="440" y="118" fill="#e6e9f2" font-size="9">Afeto</text>
  <rect x="440" y="124" width="330" height="10" fill="#1a1e2c"/>
  <rect x="440" y="124" width="230" height="10" fill="#f6757a"/>
  <text x="780" y="133" fill="#9ea7c2" font-size="8" text-anchor="end">70/100</text>

  <text x="440" y="158" fill="#8b93b0" font-size="8">Gatilho recente: Vitória (10s para responder)</text>
  <rect x="440" y="168" width="90" height="24" fill="rgba(20,23,34,0.92)" stroke="#3b4261" stroke-width="1"/>
  <text x="485" y="184" fill="#e6e9f2" font-size="8" text-anchor="middle">Elogiar</text>
  <rect x="540" y="168" width="100" height="24" fill="rgba(20,23,34,0.92)" stroke="#3b4261" stroke-width="1"/>
  <text x="590" y="184" fill="#e6e9f2" font-size="8" text-anchor="middle">Repreender</text>
  <rect x="650" y="168" width="90" height="24" fill="rgba(20,23,34,0.92)" stroke="#3b4261" stroke-width="1"/>
  <text x="695" y="184" fill="#9ea7c2" font-size="8" text-anchor="middle">(Ignorar)</text>

  <line x1="440" y1="210" x2="780" y2="210" stroke="#2b3047" stroke-width="1"/>
  <text x="440" y="228" fill="#9ea7c2" font-size="8">Afeta só caminhos alternativos de evolução — o caminho</text>
  <text x="440" y="242" fill="#9ea7c2" font-size="8">padrão nunca tem gate de vínculo (VIDEO_IDEAS_SPEC §2).</text>
  <text x="440" y="266" fill="#5a6177" font-size="8">discipline/affection 0-100, decaimento passivo p/ 50</text>
  <text x="440" y="280" fill="#5a6177" font-size="8">[H] — 0 ocorrências hoje em sim/types.ts (grep confirmado)</text>

  <text x="10" y="312" fill="#5a6177" font-size="8">Esta spec não reabre a regra do Vínculo — só referencia a proposta já escrita em VIDEO_IDEAS_SPEC.md §2, pendente de aprovação do fundador.</text>
</svg>
