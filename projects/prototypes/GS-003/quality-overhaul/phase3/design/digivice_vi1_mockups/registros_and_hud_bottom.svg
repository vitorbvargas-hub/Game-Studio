  <text x="765" y="368" fill="#5a6177" font-size="7" text-anchor="middle">equipe</text>

  <text x="10" y="432" fill="#5a6177" font-size="8">Badges só espelham uma condição já calculada hoje (complete/eligible/claimed) — nenhuma regra nova (§6.2).</text>
