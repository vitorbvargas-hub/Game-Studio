<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" font-family="monospace" shape-rendering="crispEdges">
  <rect width="420" height="320" fill="#0e1018"/>
  <g stroke="#1c2030" stroke-width="1">
    <path d="M0,20H420 M0,60H420 M0,100H420 M0,140H420 M0,180H420 M0,220H420 M0,260H420 M0,300H420"/>
    <path d="M20,0V320 M60,0V320 M100,0V320 M140,0V320 M180,0V320 M220,0V320 M260,0V320 M300,0V320 M340,0V320 M380,0V320"/>
  </g>
  <text x="8" y="14" fill="#8b93b0" font-size="10">HUD_IDENTITY_V3 — Alt A — estado ABERTO (1 clique no hub)</text>

  <circle cx="340" cy="140" r="32" fill="rgba(20,23,34,0.92)" stroke="#3b4261" stroke-width="2"/>
  <text x="340" y="144" fill="#e8b84a" font-size="16" text-anchor="middle" font-weight="bold">D</text>

  <!-- raio 72px, arco de 120 graus no quadrante inferior-esquerdo do hub -->
  <path d="M 340 140 L 340 68" fill="none" stroke="#2b3047" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="344" y="100" fill="#5a6177" font-size="7">raio 72px</text>

  <!-- 6 icones em arco, de 150 a 270 graus (abrindo p/ baixo-esquerda) -->
  <!-- posições calculadas a mão: centro (340,140), raio 72 -->
  <g>
    <rect x="300" y="182" width="32" height="32" rx="0" fill="rgba(20,23,34,0.92)" stroke="#3b4261" stroke-width="2" transform="skewX(0)"/>
    <text x="316" y="202" fill="#c77ad1" font-size="9" text-anchor="middle">GLD</text>
    <text x="316" y="222" fill="#8b93b0" font-size="7" text-anchor="middle">Guilda</text>
  </g>
  <g>
    <rect x="248" y="170" width="32" height="32" fill="rgba(20,23,34,0.92)" stroke="#3b4261" stroke-width="2"/>
    <text x="264" y="190" fill="#9ad4ff" font-size="9" text-anchor="middle">COR</text>
    <text x="264" y="210" fill="#8b93b0" font-size="7" text-anchor="middle">Correio</text>
  </g>
  <g>
    <rect x="204" y="140" width="32" height="32" fill="rgba(20,23,34,0.92)" stroke="#e8b84a" stroke-width="2"/>
    <text x="220" y="160" fill="#e8b84a" font-size="9" text-anchor="middle">PAS</text>
    <text x="220" y="180" fill="#8b93b0" font-size="7" text-anchor="middle">Passe</text>
  </g>
  <g>
    <rect x="204" y="98" width="32" height="32" fill="rgba(20,23,34,0.92)" stroke="#3b4261" stroke-width="2"/>
    <text x="220" y="118" fill="#8fe07a" font-size="9" text-anchor="middle">DES</text>
    <text x="220" y="138" fill="#8b93b0" font-size="7" text-anchor="middle">Desejos</text>
  </g>
  <g>
    <rect x="248" y="68" width="32" height="32" fill="rgba(20,23,34,0.92)" stroke="#3b4261" stroke-width="2"/>
    <text x="264" y="88" fill="#e43b44" font-size="9" text-anchor="middle">CHM</text>
    <text x="264" y="56" fill="#8b93b0" font-size="7" text-anchor="middle">Chefe Mundial</text>
  </g>
  <g>
    <rect x="300" y="56" width="32" height="32" fill="rgba(20,23,34,0.92)" stroke="#3b4261" stroke-width="2"/>
    <text x="316" y="76" fill="#feae34" font-size="9" text-anchor="middle">CNQ</text>
    <text x="316" y="44" fill="#8b93b0" font-size="7" text-anchor="middle">Conquistas</text>
  </g>

  <text x="8" y="250" fill="#5a6177" font-size="8">6 ícones, 32×32px, moldura nível 2 pequena, entrada escalonada 120ms/ícone.</text>
  <text x="8" y="262" fill="#5a6177" font-size="8">Cada clique abre o Panel correspondente (panel.ts/screens.ts) e fecha o hub.</text>
  <text x="8" y="274" fill="#5a6177" font-size="8">Nenhuma tecla nova: mesmos atalhos já existentes, só apresentados em arco.</text>
</svg>
