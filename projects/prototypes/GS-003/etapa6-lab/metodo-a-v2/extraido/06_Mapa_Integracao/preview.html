<!doctype html><html lang="pt-br"><meta charset="utf-8"><title>Digital Odyssey A - preview de assets</title><style>body{background:#182029;color:#fff;font:16px Arial;margin:30px}canvas{image-rendering:pixelated;border:2px solid #789}p{max-width:700px}</style><h2>Prévia técnica — Método A</h2><p>Esta é uma prévia independente de assets originais demonstrativos, NÃO o build jogável do OpenClaw. A integração no localhost:5191 precisa ser realizada pelo game-dev.</p><canvas id="c" width="640" height="480"></canvas><script>const c=document.querySelector('#c'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;let imgs={};let names=['grass','water','broadleaf','pine','tamer'];let paths=['../03_Terreno/grass_32x32_8frames.png','../05_Agua_Cachoeira/water_32x32_8frames.png','../04_Vegetacao/broadleaf_64x80.png','../04_Vegetacao/pine_64x80.png','../01_Tamers/tamer_original_placeholder_4dir_4frames_48x64.png'];names.forEach((n,i)=>{let im=new Image();im.src=paths[i];imgs[n]=im});function tick(t){let f=Math.floor(t/130)%8;ctx.clearRect(0,0,640,480);for(let y=0;y<15;y++)for(let x=0;x<20;x++){let w=Math.abs(x-10-Math.round(1.5*Math.sin(y/3)))<=2;let im=imgs[w?'water':'grass'];if(im.complete&&im.naturalWidth)ctx.drawImage(im,(w?f:0)*32,0,32,32,x*32,y*32,32,32)}for(let [x,y] of [[1,3],[4,9],[17,3],[15,11]]){let im=imgs.broadleaf;if(im.complete&&im.naturalWidth)ctx.drawImage(im,x*32-16,y*32-48)}let im=imgs.tamer;if(im.complete&&im.naturalWidth)ctx.drawImage(im,(Math.floor(t/200)%4)*48,0,48,64,8*32,7*32-32,48,64);requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></html>
